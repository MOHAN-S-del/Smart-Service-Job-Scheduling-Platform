<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Scheduler</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6fb;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .section {
            margin-top: 25px;
        }

        .services {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .service {
            padding: 15px;
            border: 2px solid #667eea;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            color: #667eea;
        }

        .service:hover {
            background: #667eea;
            color: #fff;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5563d6;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .filters select {
            flex: 1;
        }

        .worker-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .worker-card h3 {
            margin: 0;
        }

        .worker-card p {
            margin: 4px 0;
            color: #555;
        }

        .book-btn {
            margin-top: 10px;
            background: #28a745;
        }

        .book-btn:hover {
            background: #218838;
        }

        @media(max-width:600px) {
            .services {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Job Scheduler</h1>
    <p style="text-align:center;color:#666;">
        What service are you looking for?
    </p>

    <!-- SERVICES -->
    <div class="section services">
        <div class="service">Carpenter</div>
        <div class="service">Plumber</div>
        <div class="service">Electrician</div>
        <div class="service">Washer</div>
        <div class="service">Barber</div>
        <div class="service">Other</div>
    </div>

    <!-- JOB DETAILS -->
    <div class="section">
        <label>📍 Location</label>
        <input type="text" placeholder="Enter your area or city">

        <label>📝 Describe your work</label>
        <textarea rows="3" placeholder="Explain the problem briefly"></textarea>

        <label>📅 Date</label>
        <input type="date">

        <label>⏰ Time Slot</label>
        <select>
            <option>Morning</option>
            <option>Afternoon</option>
            <option>Evening</option>
        </select>

        <button>Find Workers</button>
    </div>

    <!-- WORKERS -->
    <div class="section">
        <h2>Available Workers</h2>

        <div class="filters">
            <select>
                <option>Sort by Nearest</option>
                <option>Sort by Lowest Price</option>
                <option>Sort by Highest Rating</option>
            </select>
        </div>

        <div class="worker-card">
            <h3>👨‍🔧 Ramesh Kumar</h3>
            <p>⭐ Rating: 4.6</p>
            <p>💰 Price: ₹300/hr</p>
            <p>📍 Distance: 2.1 km</p>
            <button class="book-btn">Book Now</button>
        </div>

        <div class="worker-card">
            <h3>👨‍🔧 Suresh Singh</h3>
            <p>⭐ Rating: 4.2</p>
            <p>💰 Price: ₹250/hr</p>
            <p>📍 Distance: 3.5 km</p>
            <button class="book-btn">Book Now</button>
        </div>
    </div>

</div>

</body>
</html>
